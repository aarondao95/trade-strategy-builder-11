<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EA Strategy Lab – Mô Phỏng Chiến Thuật Thông Minh | nhatkykiemtien.com</title>
<!-- Sử dụng hệ Font chuẩn từ nguồn của anh -->
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,700;0,900;1,300&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root {
  --ink:      #0e0f14;
  --ink2:     #181921;
  --gold:     #c8973a;
  --gold2:    #e8b86d;
  --cream:    #f5f0e8;
  --text2:    #4a4d5e;
  --serif:    'Fraunces', Georgia, serif;
  --sans:     'Instrument Sans', sans-serif;
  --mono:     'JetBrains Mono', monospace;
  --border:   rgba(200,151,58,.15);
}

body { background: var(--cream); color: var(--ink); font-family: var(--sans); line-height: 1.6; padding: 20px; }

/* CONTAINER CHÍNH - Thừa hưởng style từ */
.lab-container {
  max-width: 1000px; margin: 40px auto;
  background: #fff; border: 1px solid var(--border);
  border-radius: 16px; overflow: hidden;
  box-shadow: 0 20px 50px rgba(0,0,0,0.05);
}

.lab-header {
  background: var(--ink); color: var(--gold2);
  padding: 30px; text-align: center; border-bottom: 4px solid var(--gold);
}
.lab-header h2 { font-family: var(--serif); font-size: 28px; font-weight: 900; margin-bottom: 8px; }
.lab-header p { font-family: var(--mono); font-size: 11px; letter-spacing: 2px; opacity: 0.8; }

.lab-content { display: grid; grid-template-columns: 350px 1fr; gap: 0; }
@media(max-width: 850px) { .lab-content { grid-template-columns: 1fr; } }

/* CẤU HÌNH BÊN TRÁI */
.lab-sidebar { padding: 30px; background: #fafafa; border-right: 1px solid var(--border); }
.config-group { margin-bottom: 24px; }
.config-label { font-family: var(--mono); font-size: 11px; font-weight: 700; color: var(--gold); text-transform: uppercase; margin-bottom: 12px; display: block; }

.input-field {
  width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border);
  background: #fff; font-family: var(--sans); font-size: 14px; outline: none; transition: 0.2s;
}
.input-field:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(200,151,58,0.1); }

.indicator-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.check-item { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text2); cursor: pointer; }
.check-item input { accent-color: var(--gold); }

.btn-simulate {
  width: 100%; padding: 16px; border-radius: 8px; border: none;
  background: var(--ink); color: var(--gold2);
  font-family: var(--serif); font-size: 16px; font-weight: 700;
  cursor: pointer; transition: 0.3s; margin-top: 10px;
}
.btn-simulate:hover { background: var(--ink2); transform: translateY(-2px); }

/* KẾT QUẢ BÊN PHẢI */
.lab-main { padding: 30px; background: #fff; }
.stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 30px; }
.stat-box {
  padding: 20px; border-radius: 12px; background: var(--ink); color: #fff; text-align: center;
}
.stat-val { font-family: var(--serif); font-size: 24px; font-weight: 700; color: var(--gold2); display: block; }
.stat-lbl { font-family: var(--mono); font-size: 10px; color: var(--text2); text-transform: uppercase; margin-top: 4px; }

.chart-wrap { position: relative; height: 300px; margin-bottom: 30px; }

/* CTAs - Theo phong cách Broker Card[cite: 1] */
.cta-footer {
  padding: 30px; background: #fafafa; border-top: 1px solid var(--border);
  display: flex; justify-content: center; gap: 15px; flex-wrap: wrap;
}
.cta-link {
  padding: 10px 20px; border-radius: 6px; font-size: 12px; font-weight: 700;
  text-decoration: none; font-family: var(--mono); transition: 0.2s;
}
.cta-vantage { background: var(--gold); color: var(--ink); }
.cta-zalo { background: #0068ff; color: #fff; }
</style>
</head>
<body>

<div class="lab-container">
  <div class="lab-header">
    <h2>STRATEGY LAB 2026</h2>
    <p>THIẾT LẬP CHIẾN THUẬT EA · NHẬT KÝ KIẾM TIỀN</p>
  </div>

  <div class="lab-content">
    <!-- Sidebar thiết lập[cite: 1] -->
    <div class="lab-sidebar">
      <div class="config-group">
        <label class="config-label">1. Thị trường & Tài sản</label>
        <select id="asset" class="input-field">
          <option value="XAU">Vàng (XAUUSD)</option>
          <option value="BTC">Bitcoin (BTCUSD)</option>
          <option value="FX">Ngoại tệ (Forex Majors)</option>
        </select>
      </div>

      <div class="config-group">
        <label class="config-label">2. Chỉ báo kỹ thuật (Logic)</label>
        <div class="indicator-grid">
          <label class="check-item"><input type="checkbox" class="indi" value="RSI" checked> RSI</label>
          <label class="check-item"><input type="checkbox" class="indi" value="MA" checked> Moving Avg</label>
          <label class="check-item"><input type="checkbox" class="indi" value="MACD"> MACD</label>
          <label class="check-item"><input type="checkbox" class="indi" value="CCI"> CCI/ADX</label>
        </div>
      </div>

      <div class="config-group">
        <label class="config-label">3. Vốn & Kỳ vọng (%/Tháng)</label>
        <input type="number" id="capital" value="5000" class="input-field" style="margin-bottom:10px" placeholder="Vốn đầu tư ($)">
        <input type="number" id="target" value="15" class="input-field" placeholder="Lợi nhuận mục tiêu %">
      </div>

      <button class="btn-simulate" onclick="runSimulation()">Chạy Mô Phỏng →</button>
    </div>

    <!-- Kết quả hiển thị[cite: 1] -->
    <div class="lab-main">
      <div class="stats-grid">
        <div class="stat-box">
          <span class="stat-val" id="resProfit">+$0</span>
          <span class="stat-lbl">Lợi nhuận 6T</span>
        </div>
        <div class="stat-box">
          <span class="stat-val" id="resWR" style="color:#2d7a4f">0%</span>
          <span class="stat-lbl">Win-Rate</span>
        </div>
        <div class="stat-box">
          <span class="stat-val" id="resDD" style="color:#c53030">0%</span>
          <span class="stat-lbl">Max Drawdown</span>
        </div>
      </div>

      <div class="chart-wrap">
        <canvas id="strategyChart"></canvas>
      </div>
    </div>
  </div>

  <!-- Phễu chuyển đổi Affiliate[cite: 1] -->
  <div class="cta-footer">
    <a href="https://vigco.co/3uayqy" class="cta-link cta-vantage" target="_blank">Đăng ký Vantage nhận EA</a>
    <a href="https://zalo.me/g/eblric263" class="cta-link cta-zalo" target="_blank">Vào Nhóm Zalo Hỗ Trợ</a>
  </div>
</div>

<script>
let chart;
function runSimulation() {
  const cap = parseFloat(document.getElementById('capital').value) || 0;
  const target = parseFloat(document.getElementById('target').value) / 100;
  const indis = document.querySelectorAll('.indi:checked').length;
  
  // Logic mô phỏng: Càng nhiều indi rủi ro càng thấp, lợi nhuận ổn định hơn
  let winRate = 55 + (indis * 7);
  let dd = (target * 100 * 1.5) - (indis * 3);
  
  let dataEA = [cap];
  let dataManual = [cap];
  let labels = ['Bắt đầu'];

  for(let i=1; i<=6; i++) {
    let lastEA = dataEA[dataEA.length-1];
    dataEA.push(lastEA * (1 + target + (Math.random() * 0.04 - 0.02)));
    
    let lastMan = dataManual[dataManual.length-1];
    dataManual.push(lastMan * (1 + (target * 0.3) + (Math.random() * 0.3 - 0.2)));
    labels.push('Tháng ' + i);
  }

  document.getElementById('resProfit').innerText = '+$' + (dataEA[6] - cap).toLocaleString(undefined, {maximumFractionDigits:0});
  document.getElementById('resWR').innerText = Math.min(winRate, 92) + '%';
  document.getElementById('resDD').innerText = Math.max(dd, 5).toFixed(1) + '%';

  if(chart) chart.destroy();
  const ctx = document.getElementById('strategyChart').getContext('2d');
  chart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: labels,
      datasets: [
        { label: 'Kỷ luật EA', data: dataEA, borderColor: '#c8973a', backgroundColor: 'rgba(200,151,58,0.1)', fill: true, tension: 0.4 },
        { label: 'Trade Cảm Xúc', data: dataManual, borderColor: '#8a8d9e', borderDash: [5,5], tension: 0.4 }
      ]
    },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
  });
}
window.onload = runSimulation;
</script>
</body>
</html>
